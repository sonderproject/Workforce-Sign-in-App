{% extends "base.html" %}
{% block body_class %}kiosk-page{% endblock %}
{% block title %}Employment Center Check-In{% endblock %}
{% block content %}
<div class="card">
  <div class="brand-header">
    <p class="eyebrow">Employment Center</p>
    <h1>Check&nbsp;In</h1>
    <p>Enter your information to get started.</p>
  </div>

  <form method="post" action="{{ url_for('identify') }}" data-guard>
    <label class="field">
      <span class="lbl">First Name</span>
      <input type="text" name="first_name" autocomplete="off" autofocus required>
    </label>
    <label class="field">
      <span class="lbl">Last Name</span>
      <input type="text" name="last_name" autocomplete="off" required>
    </label>
    <label class="field">
      <span class="lbl">Date of Birth</span>
      <input type="date" name="date_of_birth" required>
    </label>
    <button type="submit" class="btn big green">Continue</button>
  </form>
</div>
<a class="subtle-link" href="{{ url_for('admin_dashboard') }}">Staff sign-in</a>
{% endblock %}
